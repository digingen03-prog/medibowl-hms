<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emb-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043784"/>
      <stop offset="100%" stop-color="#032666"/>
    </linearGradient>
    <linearGradient id="emb-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="emb-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="emb-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="emb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Outer Orbit -->
  <circle cx="50" cy="50" r="46" stroke="url(#emb-blue)" stroke-width="3" stroke-dasharray="190 20" stroke-linecap="round"/>
  
  <path d="M 12 50 C 12 26, 32 10, 56 12 C 78 14, 92 34, 90 56 C 88 74, 72 88, 52 88" 
        stroke="url(#emb-purple)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <path d="M 88 50 C 88 74, 68 90, 44 88 C 22 86, 8 66, 10 44 C 12 26, 28 12, 48 12" 
        stroke="url(#emb-cyan)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <path d="M 22 68 C 16 54, 20 34, 38 22 C 54 10, 78 14, 86 32 C 92 46, 88 64, 74 76" 
        stroke="url(#emb-green)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Core White Sphere -->
  <circle cx="50" cy="50" r="34" fill="#FFFFFF"/>
  
  <!-- Golden Meridian -->
  <ellipse cx="50" cy="50" rx="33" ry="14" stroke="url(#emb-gold)" stroke-width="2.5" fill="none" transform="rotate(-28 50 50)"/>
  
  <!-- Medical Cross -->
  <g transform="translate(50, 50)">
    <rect x="-6" y="-18" width="12" height="36" rx="3" fill="url(#emb-blue)"/>
    <rect x="-18" y="-6" width="36" height="12" rx="3" fill="url(#emb-blue)"/>
    <circle cx="0" cy="0" r="4.5" fill="url(#emb-gold)"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Orbiting Satellites -->
  <circle cx="50" cy="4" r="4" fill="url(#emb-gold)"/>
  <circle cx="94" cy="42" r="3.5" fill="#22D3EE"/>
  <circle cx="8" cy="58" r="3.5" fill="#8B5CF6"/>
  <circle cx="62" cy="94" r="4" fill="#10B981"/>
</svg>

